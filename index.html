<!doctype html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kayan Creative • کارگردانی هنری و سینماتوگرافی هوش مصنوعی</title>
  <meta name="description" content="Kayan Creative — استودیوی کارگردانی هنری، سینماتوگرافی هوش مصنوعی و پروداکشن بصری تجاری.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <!-- فونت دانا -->
  <link rel="stylesheet" href="http://c269749.parspack.net/asset/mainfiles/dana-ultrabold.ttf" as="font" crossorigin>

  <style>
    @font-face {
      font-family: 'Dana';
      src: url(http://c269749.parspack.net/asset/mainfiles/dana-ultrabold.ttf) format('truetype');
      font-weight: 900;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg: #f5f6fa;
      --text: #0e1017;
      --muted: #4f576b;
      --accent: #ff5429;
      --accent2: #ff6a42;
      --border: rgba(0,0,0,.08);
      --glass: rgba(255,255,255,.65);
      --blur: blur(22px);
      --radius: 22px;
      --font-en: 'Plus Jakarta Sans', sans-serif;
      --font-fa: 'Dana', Tahoma, sans-serif;
    }
    [data-theme="dark"] {
      --bg: #0c0e13;
      --text: #f4f6fb;
      --muted: #9ba5ba;
      --border: rgba(255,255,255,.10);
      --glass: rgba(20,24,32,.35);
    }

    * { box-sizing: border-box; margin:0; padding:0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-fa);
      padding: 16px;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      line-height: 1.75;
    }
    html[lang="en"] body { font-family: var(--font-en); }

    .container { max-width: 1240px; margin: 0 auto; }

    .ambient-bg {
      position: fixed; inset: 0; z-index: -2; pointer-events: none;
    }
    .ambient-bg video {
      width: 100%; height: 100%; object-fit: cover;
      opacity: .07; filter: saturate(1.05) contrast(1.05);
    }
    [data-theme="dark"] .ambient-bg video { opacity: .14; }

    .glass {
      background: var(--glass);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 18px 45px rgba(14,16,23,.07);
    }

    /* هدر و منو */
    header.nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 26px;
      margin-bottom: 18px;
      gap: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      color: var(--text);
      font-weight: 900;
      letter-spacing: -.4px;
      font-size: 1.28rem;
    }
    .brand img {
      width: 52px;
      height: 52px;
      border-radius: 15px;
      object-fit: cover;
      box-shadow: 0 10px 24px rgba(0,0,0,.12);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .chip, select {
      background: rgba(255,255,255,.75);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 9px 18px;
      border-radius: 999px;
      cursor: pointer;
      font-family: inherit;
      font-weight: 700;
      transition: all .22s ease;
    }
    [data-theme="dark"] .chip, [data-theme="dark"] select {
      background: rgba(20,24,32,.55);
    }
    .chip:hover, select:hover {
      background: rgba(255,84,41,.12);
      border-color: rgba(255,84,41,.55);
      transform: translateY(-2px);
    }

    /* بقیه استایل‌ها (hero, views, modal و ...) بدون تغییر */
    .view { display: none; }
    .view.active { display: block; }
    /* ... (تمام استایل‌های قبلی شما حفظ شده) ... */
  </style>
</head>

<body>
  <div class="ambient-bg">
    <video autoplay loop muted playsinline src="main/background.mp4"></video>
  </div>

  <div class="container">
    <header class="nav glass" id="top">
      <a class="brand" href="#top">
        <img src="main/logo.png" alt="Kayan Creative">
        <span>Kayan Creative</span>
      </a>

      <div class="nav-actions">
        <!-- دکمه کارهای شاخص در بالاترین موقعیت -->
        <button class="chip" id="goRepertoire" type="button">کارهای شاخص</button>
        <button class="chip" id="goHome" type="button">صفحه اصلی</button>
        <button class="chip" id="goSamples" type="button">نمونه‌کارها</button>
        <button class="chip" id="goCreativities" type="button">نوآوری‌ها</button>
        <button class="chip" id="themeToggle" type="button">حالت روز/شب</button>
        <select id="langSelect">
          <option value="fa">فارسی</option>
          <option value="en">English</option>
          <option value="ar">العربية</option>
        </select>
      </div>
    </header>

    <!-- ویوهای اصلی -->
    <div class="view active" id="viewHome"> ... </div>
    <div class="view" id="viewSamples"> ... </div>
    <div class="view" id="viewCreativities"> ... </div>
    <div class="view" id="viewRepertoire"> ... </div>

    <!-- Modal پروژه‌ها (بدون تغییر) -->
  </div>

  <script>
    let currentLang = 'fa';

    // تابع به‌روزرسانی زبان
    function updateLanguage(lang) {
      currentLang = lang;
      document.documentElement.lang = lang;

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (I18N[lang][key]) {
          el.textContent = I18N[lang][key];
        }
      });
    }

    // I18N کامل (همان قبلی شما)
    const I18N = {
      fa: {
        navHome: "صفحه اصلی",
        navSamples: "نمونه‌کارها",
        navCreativities: "نوآوری‌ها",
        navRepertoire: "کارهای شاخص",
        heroKicker: "کارگردانی هنری و سینماتوگرافی هوش مصنوعی",
        // ... تمام متن‌های قبلی شما
      },
      en: { /* متن انگلیسی */ },
      ar: { /* متن عربی */ }
    };

    // اضافه کردن رویدادهای منو
    document.getElementById('goRepertoire').addEventListener('click', () => setView('repertoire'));
    document.getElementById('goHome').addEventListener('click', () => setView('home'));
    document.getElementById('goSamples').addEventListener('click', () => setView('samples'));
    document.getElementById('goCreativities').addEventListener('click', () => setView('creativities'));

    // تغییر زبان
    document.getElementById('langSelect').addEventListener('change', (e) => {
      updateLanguage(e.target.value);
    });

    // تم تاریک/روشن
    document.getElementById('themeToggle').addEventListener('click', () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
      localStorage.setItem('theme', isDark ? 'light' : 'dark');
    });

    // تایپ‌رایتر لولوپ
    function startTypewriter() {
      const el = document.getElementById('autoType');
      if (!el) return;

      const texts = [
        "حوزه‌های تمرکز راهبردی:",
        "کارگردانی هنری",
        "سینماتوگرافی هوش مصنوعی",
        "پروداکشن تجاری"
      ];

      let index = 0;
      let charIndex = 0;
      let isDeleting = false;
      let currentText = "";

      function type() {
        const text = texts[index];
        if (isDeleting) {
          currentText = text.substring(0, charIndex - 1);
          charIndex--;
        } else {
          currentText = text.substring(0, charIndex + 1);
          charIndex++;
        }

        el.textContent = currentText;

        let delay = 80;

        if (!isDeleting && charIndex === text.length) {
          delay = 1400;
          isDeleting = true;
        } else if (isDeleting && charIndex === 0) {
          isDeleting = false;
          index = (index + 1) % texts.length;
        }

        setTimeout(type, delay);
      }
      type();
    }

    // شروع تایپ‌رایتر
    window.onload = () => {
      startTypewriter();
      // اعمال تم ذخیره‌شده
      const savedTheme = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
    };

    function setView(view) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById('view' + view.charAt(0).toUpperCase() + view.slice(1)).classList.add('active');
      window.scrollTo(0, 0);
    }
  </script>
</body>
</html>
