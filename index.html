<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کایان</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: Tahoma, sans-serif; background:#0f0f14; color:#f2f2f2; text-align:center; }
  header { padding:40px 20px 10px; }
  .logo { width:140px; height:auto; }
  h1 { margin-top:16px; font-size:2rem; letter-spacing:1px; }
  .hero { padding:30px 20px; }
  .face { max-width:320px; width:90%; border-radius:16px; box-shadow:0 8px 30px rgba(0,0,0,.5); }
  .gallery { display:flex; flex-wrap:wrap; justify-content:center; gap:16px; padding:20px 10px 50px; }
  .gallery img { width:45%; max-width:420px; border-radius:12px; }
  footer { padding:20px; font-size:.85rem; color:#888; }
</style>
</head>
<body>
  <header>
    <img src="logo.webp" alt="لوگوی کایان" class="logo">
    <h1>کایان</h1>
  </header>
  <section class="hero">
    <img src="kayan-face.webp" alt="کایان" class="face">
  </section>
  <section class="gallery">
    <img src="capture1.webp" alt="نمونه ۱">
  </section>
  <footer>&copy; Kayan</footer>
</body>
</html>
