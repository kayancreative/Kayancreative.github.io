<!-- KAYAN CREATIVE ANALYTICS TRACKER -->
<script>
(() => {
  // 1. تولید یا بازخوانی شناسه یکتای بازدیدکننده (Unique Visitor ID)
  let visitorId = localStorage.getItem('_kayan_vid');
  if (!visitorId) {
    visitorId = 'vid_' + Math.random().toString(36).substring(2, 15) + Date.now().toString(36);
    localStorage.setItem('_kayan_vid', visitorId);
  }

  // 2. تابع ارسال رویدادها (پشتیبانی از sendBeacon برای بستن به موقع تب)
  const trackEvent = (eventType, extraData = {}) => {
    const payload = {
      visitor_id: visitorId,
      path: window.location.pathname + window.location.hash,
      referrer: document.referrer || 'Direct Search / Bookmark',
      screen: `${window.screen.width}x${window.screen.height}`,
      event_type: eventType,
      timestamp: new Date().toISOString(),
      ...extraData
    };

    // آدرس Cloudflare Worker یا API جمع‌آوری‌کننده شما
    const endpoint = 'https://YOUR_WORKER_SUBDOMAIN.workers.dev/collect';
    
    try {
      if (navigator.sendBeacon) {
        navigator.sendBeacon(endpoint, JSON.stringify(payload));
      } else {
        fetch(endpoint, {
          method: 'POST',
          body: JSON.stringify(payload),
          keepalive: true,
          headers: { 'Content-Type': 'application/json' }
        });
      }
    } catch (e) {
      console.error('Analytics error:', e);
    }
  };

  // ثبت بازدید صفحه اولیه
  trackEvent('page_view');

  // رصد تغییرات هش (مثلا وقتی کاربر روی منو کلیک می‌کند و میره روی #contact)
  window.addEventListener('hashchange', () => {
    trackEvent('hash_navigation', { target_hash: window.location.hash });
  });

  // رهگیری دقیق تعاملات بخش Contact (فرم تماس و دکمه‌ها)
  document.addEventListener('DOMContentLoaded', () => {
    const contactSection = document.getElementById('view-contact');
    if (contactSection) {
      // رهگیری سابمیت فرم تماس
      const contactForm = contactSection.querySelector('form');
      if (contactForm) {
        contactForm.addEventListener('submit', (e) => {
          // استخراج مقادیر فیلدها بدون ذخیره رمز عبور یا اطلاعات حساس رمزنگاری‌نشده
          const nameInput = contactForm.querySelector('input[data-ip="name"]');
          const emailInput = contactForm.querySelector('input[data-ip="email"]');
          
          trackEvent('contact_form_submit', {
            sender_name: nameInput ? nameInput.value : 'unknown',
            sender_email: emailInput ? emailInput.value : 'unknown'
          });
        });
      }
    }
  });
})();
