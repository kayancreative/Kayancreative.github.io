<script>
(function() {
  const ENDPOINT = 'https://kayan-analytics.danialkayan.workers.dev/collect';
  
  // تولید یا خواندن Visitor ID
  let vid = localStorage.getItem('kayan_vid');
  if (!vid) {
    vid = 'kv_' + Math.random().toString(36).substring(2, 10) + Date.now().toString(36);
    localStorage.setItem('kayan_vid', vid);
  }

  function getDevice() {
    const ua = navigator.userAgent;
    if (/Mobi|Android/i.test(ua)) return 'Mobile';
    if (/Tablet|iPad/i.test(ua)) return 'Tablet';
    return 'Desktop';
  }

  function getBrowser() {
    const ua = navigator.userAgent;
    if (ua.includes('Chrome')) return 'Chrome';
    if (ua.includes('Safari') && !ua.includes('Chrome')) return 'Safari';
    if (ua.includes('Firefox')) return 'Firefox';
    if (ua.includes('Edge')) return 'Edge';
    return 'Other';
  }

  function getCurrentTab() {
    const hash = window.location.hash.replace('#', '') || 'home';
    return hash;
  }

  function sendData(type, target, details = {}) {
    const payload = {
      visitor_id: vid,
      type: type,
      target: target,
      tab: getCurrentTab(),
      device: getDevice(),
      browser: getBrowser(),
      details: details,
      url: window.location.href,
      timestamp: Date.now()
    };

    const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
    if (navigator.sendBeacon) {
      navigator.sendBeacon(ENDPOINT, blob);
    } else {
      fetch(ENDPOINT, {
        method: 'POST',
        body: blob,
        keepalive: true,
        headers: { 'Content-Type': 'application/json' }
      }).catch(() => {});
    }
  }

  // ثبت بازدید اولیه صفحه
  sendData('page_view', document.title || 'Kayan Creative Agency');

  // ردیابی تمام کلیک‌های کاربران روی المان‌ها
  document.addEventListener('click', function(e) {
    const el = e.target.closest('a, button, input, [role="button"], img, .clickable');
    if (!el) return;
    
    let targetName = el.innerText || el.getAttribute('aria-label') || el.id || el.className || el.tagName;
    targetName = targetName.trim().substring(0, 40);

    sendData('click', targetName, {
      tag: el.tagName,
      id: el.id,
      className: typeof el.className === 'string' ? el.className : ''
    });
  }, { passive: true });

  // ردیابی تغییر تب‌ها (Hash Change)
  window.addEventListener('hashchange', function() {
    sendData('tab_change', getCurrentTab());
  });
})();
</script>
