<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کایان — Kayan Super App</title>
<link rel="icon" href="assets/kayan-logo.webp">
<style>
:root{
  --orange:#f97316;--orange2:#fb923c;
  --bg-dark:#0b0e14;--bg-light:#f2f4f8;
  --glass-dark:rgba(255,255,255,.06);--glass-light:rgba(255,255,255,.55);
  --border-dark:rgba(255,255,255,.12);--border-light:rgba(255,255,255,.65);
  --text-dark:#f1f5f9;--text-light:#1e293b;
  --muted-dark:#94a3b8;--muted-light:#64748b;
  --radius:20px;--blur:blur(16px);
  --t:.45s cubic-bezier(.4,0,.2,1);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Vazirmatn','Segoe UI',Tahoma,sans-serif;background:var(--bg-dark);color:var(--text-dark);min-height:100vh;transition:background var(--t),color var(--t);overflow-x:hidden}
body.light{background:var(--bg-light);color:var(--text-light)}
body::before{content:"";position:fixed;inset:0;z-index:-2;
  background:radial-gradient(600px 400px at 15% 20%,rgba(249,115,22,.18),transparent 60%),
             radial-gradient(500px 400px at 85% 75%,rgba(249,115,22,.12),transparent 60%),
             radial-gradient(400px 300px at 60% 10%,rgba(59,130,246,.08),transparent 60%)}
.glass{background:var(--glass-dark);border:1px solid var(--border-dark);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-radius:var(--radius);box-shadow:0 8px 32px rgba(0,0,0,.25);transition:background var(--t),border-color var(--t),box-shadow var(--t),transform var(--t)}
body.light .glass{background:var(--glass-light);border-color:var(--border-light);box-shadow:0 8px 32px rgba(30,41,59,.12)}

/* Top bar */
.topbar{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:12px 22px;margin:12px;border-radius:var(--radius)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.12em;font-size:1.1rem;direction:ltr}
.brand img{height:36px;width:36px;border-radius:10px;object-fit:cover}
.top-actions{display:flex;align-items:center;gap:10px}
.lang-switch{display:flex;gap:2px;padding:3px;border-radius:12px}
.lang-switch button{background:transparent;border:0;color:inherit;font:inherit;font-size:.8rem;font-weight:700;padding:5px 10px;border-radius:9px;cursor:pointer;opacity:.55;transition:all var(--t)}
.lang-switch button.active{background:var(--orange);color:#fff;opacity:1}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:12px;background:transparent;border:1px solid var(--border-dark);color:inherit;cursor:pointer;transition:all var(--t)}
body.light .icon-btn{border-color:rgba(30,41,59,.18)}
.icon-btn:hover{background:var(--orange);border-color:var(--orange);color:#fff;transform:translateY(-1px)}
.icon-btn svg,.nav-ico svg,.card-ico svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Desktop nav */
.desk-nav{display:flex;gap:4px;padding:5px;border-radius:14px}
.desk-nav a{display:flex;align-items:center;gap:7px;color:inherit;text-decoration:none;font-size:.88rem;font-weight:600;padding:8px 14px;border-radius:11px;opacity:.7;transition:all var(--t);cursor:pointer}
.desk-nav a:hover{opacity:1;background:rgba(249,115,22,.12)}
.desk-nav a.active{opacity:1;background:var(--orange);color:#fff}
@media(max-width:900px){.desk-nav{display:none}}

/* Views */
main{padding:110px 22px 110px;max-width:1150px;margin:0 auto}
.view{display:none;opacity:0;transform:translateY(14px);transition:opacity .5s ease,transform .5s ease}
.view.active{display:block;opacity:1;transform:none}
.hero{text-align:center;padding:56px 30px;margin-bottom:30px}
.hero img{height:88px;width:88px;border-radius:22px;object-fit:cover;margin-bottom:18px;box-shadow:0 10px 40px rgba(249,115,22,.35)}
.hero h1{font-size:clamp(1.7rem,4vw,2.6rem);margin-bottom:12px}
.hero h1 span{background:linear-gradient(90deg,var(--orange),var(--orange2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted-dark);max-width:560px;margin:0 auto 22px;line-height:1.9;font-size:.98rem}
body.light .hero p{color:var(--muted-light)}
.btn{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--orange),var(--orange2));color:#fff;border:0;font:inherit;font-weight:700;padding:12px 26px;border-radius:14px;cursor:pointer;transition:transform var(--t),box-shadow var(--t);box-shadow:0 8px 24px rgba(249,115,22,.35)}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(249,115,22,.5)}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}

.grid{display:grid;gap:18px}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{padding:26px;cursor:pointer;position:relative;overflow:hidden}
.card:hover{transform:translateY(-4px);border-color:rgba(249,115,22,.5);box-shadow:0 16px 40px rgba(249,115,22,.18)}
.card-ico{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:rgba(249,115,22,.15);color:var(--orange);margin-bottom:16px}
.card h3{margin-bottom:9px;font-size:1.05rem}
.card p{color:var(--muted-dark);font-size:.87rem;line-height:1.8}
body.light .card p{color:var(--muted-light)}
.section-title{font-size:1.5rem;margin:34px 0 18px;text-align:center}
.filter-bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:24px}
.filter-bar button{background:transparent;border:1px solid var(--border-dark);color:inherit;font:inherit;font-size:.8rem;font-weight:600;padding:7px 16px;border-radius:20px;cursor:pointer;transition:all var(--t);opacity:.7}
body.light .filter-bar button{border-color:rgba(30,41,59,.18)}
.filter-bar button.active,.filter-bar button:hover{background:var(--orange);border-color:var(--orange);color:#fff;opacity:1}
.gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.gal-item{aspect-ratio:4/3;border-radius:var(--radius);overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative;cursor:zoom-in;background:linear-gradient(135deg,rgba(249,115,22,.14),rgba(59,130,246,.1))}
.gal-item svg{width:56px;height:56px;stroke:var(--orange);fill:none;stroke-width:1;opacity:.85;transition:transform .5s}
.gal-item:hover svg{transform:scale(1.2)}
.gal-item span{position:absolute;bottom:12px;font-size:.75rem;font-weight:600;opacity:.7}
.gal-item.hide{display:none}

/* Lightbox */
.lightbox{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);backdrop-filter:blur(8px)}
.lightbox.open{display:flex}
.lb-box{max-width:420px;width:90%;padding:36px;text-align:center;position:relative;animation:pop .35s ease}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.lb-box svg.big{width:120px;height:120px;stroke:var(--orange);fill:none;stroke-width:.8;margin:10px auto 20px;display:block}
.lb-close{position:absolute;top:12px;inset-inline-end:12px}

/* Contact form */
form{display:grid;gap:14px;max-width:520px;margin:0 auto;padding:30px}
form input,form textarea{background:transparent;border:1px solid var(--border-dark);border-radius:12px;color:inherit;font:inherit;padding:12px 14px;transition:border var(--t)}
body.light form input,body.light form textarea{border-color:rgba(30,41,59,.18)}
form input:focus,form textarea:focus{outline:none;border-color:var(--orange)}
form textarea{min-height:110px;resize:vertical}

/* Mobile bottom nav */
.mob-nav{display:none;position:fixed;bottom:12px;left:12px;right:12px;z-index:50;justify-content:space-around;padding:8px;border-radius:var(--radius)}
.mob-nav a{display:flex;flex-direction:column;align-items:center;gap:3px;color:inherit;text-decoration:none;font-size:.62rem;font-weight:600;opacity:.55;padding:6px 10px;border-radius:12px;transition:all var(--t);cursor:pointer}
.mob-nav a.active{opacity:1;color:var(--orange);background:rgba(249,115,22,.12)}
@media(max-width:900px){.mob-nav{display:flex}main{padding-bottom:130px}}
[dir="ltr"] .brand{font-family:'Segoe UI',sans-serif}
</style>
</head>
<body>

<header class="topbar glass">
  <div class="brand"><img src="assets/kayan-logo.webp" alt="Kayan logo"><span>KAYAN</span></div>
  <nav class="desk-nav glass" id="deskNav"></nav>
  <div class="top-actions">
    <div class="lang-switch glass" id="langSwitch">
      <button data-lang="fa">FA</button><button data-lang="en">EN</button><button data-lang="ar">AR</button>
    </div>
    <button class="icon-btn" id="searchBtn" aria-label="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></button>
    <button class="icon-btn" id="themeBtn" aria-label="theme"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  </div>
</header>

<main>
  <!-- HOME -->
  <section class="view" id="view-home">
    <div class="hero glass">
      <img src="assets/kayan-logo.webp" alt="Kayan">
      <h1><span data-i="heroTitle"></span></h1>
      <p data-i="heroSub"></p>
      <button class="btn" data-go="services"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg><span data-i="exploreBtn"></span></button>
    </div>
    <h2 class="section-title" data-i="featuresTitle"></h2>
    <div class="grid g3" id="featuresGrid"></div>
  </section>

  <!-- PORTFOLIO -->
  <section class="view" id="view-portfolio">
    <h2 class="section-title" data-i="portfolioTitle"></h2>
    <div class="filter-bar glass" style="padding:10px" id="filterBar"></div>
    <div class="gal-grid" id="galGrid"></div>
  </section>

  <!-- SERVICES -->
  <section class="view" id="view-services">
    <h2 class="section-title" data-i="servicesTitle"></h2>
    <div class="grid g3" id="servicesGrid"></div>
  </section>

  <!-- ART HOUSE -->
  <section class="view" id="view-arthouse">
    <h2 class="section-title" data-i="artTitle"></h2>
    <div class="hero glass" style="padding:36px">
      <img src="assets/kayan-mark.svg" alt="Kayan art" style="height:120px;width:220px;border-radius:20px;object-fit:cover;margin-bottom:16px">
      <p data-i="artIntro" style="color:inherit;opacity:.75"></p>
    </div>
    <div class="grid g3" id="artGrid"></div>
  </section>

  <!-- CONTACT -->
  <section class="view" id="view-contact">
    <h2 class="section-title" data-i="contactTitle"></h2>
    <form class="glass" onsubmit="event.preventDefault();alert(t('sentMsg'))">
      <input type="text" data-ip="name" required>
      <input type="email" data-ip="email" required>
      <textarea data-ip="message" required></textarea>
      <button class="btn" type="submit"><svg viewBox="0 0 24 24"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg><span data-i="sendBtn"></span></button>
    </form>
  </section>
</main>

<nav class="mob-nav glass" id="mobNav"></nav>

<div class="lightbox" id="lightbox">
  <div class="lb-box glass">
    <button class="icon-btn lb-close" id="lbClose"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    <svg class="big" viewBox="0 0 24 24" id="lbIcon"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="9" cy="9" r="2"/><path d="m21 15-4-4-8 8"/></svg>
    <h3 id="lbTitle"></h3>
    <p id="lbDesc" style="opacity:.7;font-size:.88rem;margin-top:8px;line-height:1.8"></p>
  </div>
</div>

  art:[{t:"الشكل والفضاء",d:"تكوينات تجريدية من الأشكال الهندسية.",i:"shape"},{t:"الضوء واللون",d:"لعب الضوء البرتقالي على الأسطح الداكنة.",i:"bolt"},{t:"طبقات المعنى",d:"طبقات شفافة وعمق بصري.",i:"layers"},{t:"الخط الحر",d:"خطوط يدوية معبّرة.",i:"brush"}],
  gallery:["استكشاف برتقالي","توازن هندسي","تدفق الضوء","مونوغرام كيان","طبقات زجاجية","نبض تجريدي","دائرة ومربع","أفق بسيط"]}
};
let lang=localStorage.getItem('kayan-lang')||'fa',t=k=>I18N[lang][k]||k;
const $=s=>document.querySelector(s),VIEWS=['home','portfolio','services','arthouse','contact'];
const SVG_HTML=i=>ICONS[i]||ICONS.abstract;

function buildStatic(){
  const navHTML=VIEWS.map(v=>`<a data-go="${v}">${SVG_HTML(v==='portfolio'?'gallery':v==='arthouse'?'palette':v)}<span data-i="nav.${v}"></span></a>`).join('');
  $('#deskNav').innerHTML=navHTML;$('#mobNav').innerHTML=navHTML;
  document.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click',e=>{e.preventDefault();go(el.dataset.go)}));
}
function render(){
  const L=I18N[lang];
  document.documentElement.lang=lang;document.documentElement.dir=L.dir;
  document.querySelectorAll('[data-i]').forEach(el=>{
    const k=el.dataset.i;
    if(k.startsWith('nav.'))el.textContent=t('nav')[k.slice(4)];
    else el.textContent=t(k);
  });
  document.querySelectorAll('[data-ip]').forEach(el=>el.placeholder=t('ph'+el.dataset.ip[0].toUpperCase()+el.dataset.ip.slice(1)));
  $('#searchBtn').setAttribute('title',t('searchPlaceholder'));
  $('#featuresGrid').innerHTML=t('features').map(c=>`<div class="card glass"><div class="card-ico">${SVG_HTML(c.i)}</div><h3>${c.t}</h3><p>${c.d}</p></div>`).join('');
  $('#servicesGrid').innerHTML=t('services').map(c=>`<div class="card glass"><div class="card-ico">${SVG_HTML(c.i)}</div><h3>${c.t}</h3><p>${c.d}</p></div>`).join('');
  $('#artGrid').innerHTML=t('art').map(c=>`<div class="card glass"><div class="card-ico">${SVG_HTML(c.i)}</div><h3>${c.t}</h3><p>${c.d}</p></div>`).join('');
  // gallery: abstract SVG art tiles, no photos
  const shapes=['shape','abstract','layers','palette','motion','bolt','brush','globe'];
  $('#galGrid').innerHTML=L.gallery.map((g,n)=>`<div class="gal-item glass" data-cat="${n%3}" data-title="${g}">${SVG_HTML(shapes[n%shapes.length])}<span>${g}</span></div>`).join('');
  $('#filterBar').innerHTML=[['all',t('filterAll')],['0',t('gallery')[0]],['1',t('gallery')[1]],['2',t('gallery')[2]]]
    .map(([v,l],i)=>`<button data-f="${v}" class="${i==0?'active':''}">${l}</button>`).join('');
  document.querySelectorAll('#filterBar button').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('#filterBar button').forEach(x=>x.classList.remove('active'));b.classList.add('active');
    document.querySelectorAll('.gal-item').forEach(it=>it.classList.toggle('hide',b.dataset.f!=='all'&&it.dataset.cat!==b.dataset.f));
  });
  document.querySelectorAll('.gal-item').forEach(it=>it.onclick=()=>openLB(it));
  document.querySelectorAll('#langSwitch button').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));
}
function go(v){
  VIEWS.forEach(x=>$('#view-'+x).classList.toggle('active',x===v));
  document.querySelectorAll('[data-go]').forEach(a=>a.classList.toggle('active',a.dataset.go===v));
  if(location.hash!=='#'+v)location.hash=v;
  window.scrollTo({top:0,behavior:'smooth'});
}
function openLB(el){$('#lbTitle').textContent=el.dataset.title;$('#lbDesc').textContent=t('portfolioTitle')+' — KAYAN';$('#lightbox').classList.add('open')}
$('#lbClose').onclick=()=>$('#lightbox').classList.remove('open');
$('#lightbox').onclick=e=>{if(e.target.id==='lightbox')$('#lightbox').classList.remove('open')};
$('#themeBtn').onclick=()=>{document.body.classList.toggle('light');localStorage.setItem('kayan-theme',document.body.classList.contains('light')?'light':'dark')};
document.querySelectorAll('#langSwitch button').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;localStorage.setItem('kayan-lang',lang);render()});
$('#searchBtn').onclick=()=>go('portfolio');
if(localStorage.getItem('kayan-theme')==='light')document.body.classList.add('light');
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(VIEWS.includes(v))go(v)});
buildStatic();
render();
go(VIEWS.includes(location.hash.slice(1))?location.hash.slice(1):'home');
</script>
</body>
</html>
