<!-- در انتهای فایل index.html قبل از بسته شدن </body> -->
<script src="portfolio-data.js"></script>
<script>
  function renderPortfolio(filter = 'all') {
    const gridContainer = document.getElementById('grid');
    if (!gridContainer || !window.PORTFOLIO_ITEMS) return;

    gridContainer.innerHTML = '';

    const filtered = filter === 'all' 
      ? window.PORTFOLIO_ITEMS 
      : window.PORTFOLIO_ITEMS.filter(item => item.category === filter);

    filtered.forEach(item => {
      const card = document.createElement('div');
      card.className = 'card';
      card.setAttribute('data-category', item.category);

      card.innerHTML = `
        <div class="card-media">
          ${item.type === 'video' 
            ? `<video src="${item.src}" poster="${item.poster || ''}" muted loop playsinline></video>`
            : `<img src="${item.src}" alt="${item.title}" loading="lazy" />`
          }
          <span class="badge">${item.tag}</span>
        </div>
        <div class="card-meta">
          <h3 class="card-title">${item.title}</h3>
        </div>
      `;

      // کنترل هوشمند پخش ویدیو در موبایل/هاور
      const video = card.querySelector('video');
      if (video) {
        card.addEventListener('mouseenter', () => video.play().catch(() => {}));
        card.addEventListener('mouseleave', () => video.pause());
      }

      gridContainer.appendChild(card);
    });
  }

  // اجرای اولیه
  document.addEventListener('DOMContentLoaded', () => {
    renderPortfolio('all');
  });
</script>
