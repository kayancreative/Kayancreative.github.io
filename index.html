<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کایان — Kayan Super App</title>
<link rel="icon" href="assets/kayan-logo.webp">
<style>
:root{
  --orange:#f97316;--orange2:#fb923c;
  --bg-dark:#0b0e14;--bg-light:#f2f4f8;
  --glass-dark:rgba(255,255,255,.06);--glass-light:rgba(255,255,255,.55);
  --border-dark:rgba(255,255,255,.12);--border-light:rgba(255,255,255,.65);
  --text-dark:#f1f5f9;--text-light:#1e293b;
  --muted-dark:#94a3b8;--muted-light:#64748b;
  --radius:20px;--blur:blur(16px);
}
body { background: var(--bg-dark); color: var(--text-dark); font-family: Tahoma, sans-serif; margin: 0; padding: 20px; }
.glass { background: var(--glass-dark); backdrop-filter: var(--blur); border: 1px solid var(--border-dark); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; }
button, input, textarea, select { font: inherit; color: inherit; background: transparent; border: 1px solid var(--border-dark); border-radius: 8px; padding: 10px; }
.btn { background: var(--orange); color: #fff; border: none; cursor: pointer; font-weight: bold; }
.btn:hover { background: var(--orange2); }
form { display: flex; flex-direction: column; gap: 12px; max-width: 450px; }
</style>
</head>
<body>

<main>
  <section class="glass">
    <h1>استودیو خلاق کایان</h1>
    <p>سامانه جامع تله‌متری و ارتباط با مشتریان</p>
  </section>

  <section class="glass">
    <h2>ارتباط با ما و ثبت تیکت</h2>
    <form id="contactForm">
      <input type="text" id="name" placeholder="نام شما" required>
      <input type="text" id="phone" placeholder="شماره تماس">
      <input type="email" id="email" placeholder="ایمیل">
      <input type="text" id="subject" placeholder="موضوع پیام">
      <textarea id="message" rows="4" placeholder="متن پیام خود را بنویسید..." required></textarea>
      <button type="submit" class="btn" id="submitBtn">ارسال پیام</button>
    </form>
    <p id="formStatus" style="margin-top:10px; font-weight:bold;"></p>
  </section>
</main>

<script>
'use strict';
// مدیریت شناسه یکتا (Visitor ID)
function getVisitorId() {
  let vid = document.cookie.replace(/(?:(?:^|.*;\s*)kayan_vid\s*\=\s*([^;]*).*$)|^.*$/, "$1");
  if (!vid) {
    vid = 'usr_' + Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
    document.cookie = "kayan_vid=" + vid + "; path=/; max-age=31536000; SameSite=Lax";
  }
  return vid;
}

// ارسال تله‌متری رویدادها به Worker
function sendTelemetry(eventType, section, details = '') {
  try {
    navigator.sendBeacon('/collect', JSON.stringify({
      visitor_id: getVisitorId(),
      event_type: eventType,
      section: section,
      details: details,
      path: window.location.pathname,
      referrer: document.referrer
    }));
  } catch (e) {
    fetch('/collect', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        visitor_id: getVisitorId(),
        event_type: eventType,
        section: section,
        details: details,
        path: window.location.pathname,
        referrer: document.referrer
      })
    }).catch(() => {});
  }
}

// ثبت بازدید اولیه صفحه
window.addEventListener('DOMContentLoaded', () => {
  sendTelemetry('page_view', 'صفحه اصلی', 'بازدید اولیه صفحه');
});

// مدیریت ارسال فرم تماس و تیکت
document.getElementById('contactForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const statusEl = document.getElementById('formStatus');
  const btn = document.getElementById('submitBtn');
  
  const payload = {
    name: document.getElementById('name').value,
    phone: document.getElementById('phone').value,
    email: document.getElementById('email').value,
    subject: document.getElementById('subject').value,
    message: document.getElementById('message').value
  };

  btn.disabled = true;
  statusEl.style.color = '#fb923c';
  statusEl.textContent = 'در حال ارسال پیام...';

  try {
    const res = await fetch('/api/ticket', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    
    if (!res.ok) throw new Error(data.error || 'خطا در ثبت پیام');

    statusEl.style.color = '#4ade80';
    statusEl.textContent = 'پیام شما با موفقیت ارسال شد و در سیستم ثبت گردید!';
    document.getElementById('contactForm').reset();
    sendTelemetry('submit_ticket', 'ارتباط با ما', 'شناسه تیکت: ' + (data.ticket_id || 'نامشخص'));
  } catch (err) {
    statusEl.style.color = '#f87171';
    statusEl.textContent = 'خطا: ' + err.message;
  } finally {
    btn.disabled = false;
  }
});

// ثبت کلیک‌های عمومی کاربران برای تله‌متری
document.addEventListener('click', (e) => {
  const target = e.target.closest('button, a');
  if (!target) return;
  const label = target.innerText.trim().slice(0, 50) || target.id || target.className;
  sendTelemetry('click_element', 'تعامل کاربر', 'المان: ' + label);
});
</script>

</body>
</html>
