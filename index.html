<script>
(function() {
  const ENDPOINT = 'https://kayan-analytics.danialkayan.workers.dev/collect';
  
  let vid = localStorage.getItem('kayan_vid');
  if (!vid) {
    vid = 'kv_' + Math.random().toString(36).substring(2, 10) + Date.now().toString(36);
    localStorage.setItem('kayan_vid', vid);
  }

  function sendEvent(eventType, section, target, details = {}) {
    const payload = {
      event_type: eventType,
      section: section,
      target: target,
      details: typeof details === 'object' ? JSON.stringify(details) : details,
      visitor_id: vid,
      url: window.location.href,
      device: /Mobi|Android/i.test(navigator.userAgent) ? 'Mobile' : 'Desktop',
      timestamp: new Date().toISOString()
    };

    if (navigator.sendBeacon) {
      const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
      navigator.sendBeacon(ENDPOINT, blob);
    } else {
      fetch(ENDPOINT, {
        method: 'POST',
        mode: 'cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
        keepalive: true
      }).catch(err => console.error("Telemetry error:", err));
    }
  }

  // ثبت بازدید اولیه
  sendEvent('page_view', 'hero', 'load', { title: document.title });

  // ردیابی کلیک‌ها روی دکمه‌ها و لینک‌ها
  document.addEventListener('click', function(e) {
    const targetEl = e.target.closest('a, button, [data-track]');
    if (!targetEl) return;
    
    const targetName = targetEl.getAttribute('data-track') || targetEl.innerText.trim().substring(0, 30) || targetEl.id || 'unknown_element';
    const section = targetEl.closest('section, header, footer, nav') ? targetEl.closest('section, header, footer, nav').id || 'general' : 'general';
    
    sendEvent('click', section, targetName, { tagName: targetEl.tagName });
  });
})();
</script>
