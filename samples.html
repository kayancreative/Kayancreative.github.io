  <style>
    :root {
      --bg: #050507;
      --surface: #0e0e13;
      --accent: #ff601c;
      --accent-glow: rgba(255, 96, 28, 0.65);
      --neon-violet: #8a2be2;
      --text: #ffffff;
      --text-dim: #8b8b9e;
      --font-bold: 'Syne', sans-serif;
      --font-mono: 'Space Mono', monospace;
      --font-fa: 'Dana', sans-serif; /* فونت دانا برای متن فارسی */
    }

    @font-face {
      font-family: 'Dana';
      src: url(http://c269749.parspack.net/asset/mainfiles/dana-ultrabold.ttf) format('truetype');
      font-weight: 900;
      font-style: normal;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-fa); /* فونت دانا برای همه متن فارسی */
      overflow-x: hidden;
      padding: 60px 0 140px;
      position: relative;
    }

    /* بقیه استایل‌های قبلی بدون تغییر */
    .brand-lead-header { margin-bottom: 55px; }
    .brand-badge { font-family: var(--font-mono); font-size: 0.8rem; letter-spacing: 3px; color: var(--accent); }
    .giant-title { font-family: var(--font-bold); font-size: clamp(2.8rem, 6.5vw, 6.2rem); font-weight: 900; }
    .sub-fa-title { font-family: var(--font-fa); font-size: clamp(1.8rem, 4vw, 3.5rem); font-weight: 900; }
    .seo-subtitle { font-size: 1.02rem; color: var(--text-dim); margin-top: 18px; font-weight: 300; }

    /* بقیه استایل‌ها (showcase-row, floating-layer, project-name و ...) دقیقاً همان قبلی است */

    .showcase-row .project-name { font-family: var(--font-fa); }
    .showcase-row .industry-lead { font-family: var(--font-mono); }
    .showcase-row .project-narrative { font-family: var(--font-fa); }
    .pill { font-family: var(--font-mono); }

    .innovation-title { font-family: var(--font-fa); }
    .exp-title { font-family: var(--font-fa); }
    .exp-desc { font-family: var(--font-fa); }
  </style>
