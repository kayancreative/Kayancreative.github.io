*{box-sizing:border-box}html{min-height:100%;scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 80% -10%,rgba(255,85,0,.16),transparent 34%),radial-gradient(ellipse at 8% 45%,rgba(89,66,150,.08),transparent 35%),var(--bg);color:var(--text);font-family:var(--fa);line-height:1.7;transition:background .25s,color .25s}html[lang="en"] body{font-family:var(--en)}button{font:inherit;color:inherit}.wrap{width:min(1200px,calc(100% - 44px));margin:auto}.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:22px 0;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:12px;color:var(--text);text-decoration:none;font:700 18px 'Frizon',var(--en),sans-serif;letter-spacing:.06em}.brand img{width:46px;height:46px;object-fit:contain;border-radius:13px;box-shadow:0 8px 28px #ff550033}.actions{display:flex;align-items:center;gap:9px}.control,.back{border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(15px);border-radius:99px;padding:9px 15px;cursor:pointer;transition:.2s;font-size:13px}.control:hover,.back:hover{border-color:#ff550088;background:rgba(255,85,0,.1);transform:translateY(-1px)}.back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--text)}.hero{padding:65px 0 30px}.eyebrow{color:var(--orange);font:700 11px 'Space Mono',monospace;letter-spacing:.18em;text-transform:uppercase;display:flex;align-items:center;gap:11px}.eyebrow:before{content:"";width:26px;height:1px;background:var(--orange)}h1{font:400 clamp(48px,8vw,88px)/1.05 'Frizon',var(--en),sans-serif;letter-spacing:-.025em;margin:17px 0 8px}.fa-title{display:block;font:800 clamp(25px,4vw,39px)/1.5 var(--fa);letter-spacing:0;margin-top:9px}.intro{margin:14px 0 0;color:var(--muted);font-size:15px;max-width:700px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin:25px 0 23px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.count{color:var(--muted);font:12px 'Space Mono',monospace}.filters{display:flex;flex-wrap:wrap;gap:8px}.filter{border:1px solid var(--line);background:var(--panel);padding:8px 16px;border-radius:99px;cursor:pointer;color:var(--muted);transition:.2s;font-size:13px}.filter:hover{border-color:#ff550088;color:var(--text)}.filter[aria-pressed="true"]{background:var(--orange);color:#fff;border-color:var(--orange);font-weight:700;box-shadow:0 7px 22px #ff550033}

.grid{columns:3 280px;column-gap:18px;padding-bottom:72px}.item{display:inline-block;vertical-align:top;width:100%;margin:0 0 18px;overflow:hidden;break-inside:avoid;border:1px solid var(--line);border-radius:19px;background:var(--panel);backdrop-filter:blur(16px);box-shadow:var(--shadow);transition:transform .28s,border-color .28s,box-shadow .28s}.item:hover{transform:translateY(-5px);border-color:#ff550077;box-shadow:0 24px 60px #ff55001c}.item[hidden]{display:none!important}.media{position:relative;background:#16161b;overflow:hidden}.media video,.media img{display:block;width:100%;height:auto;object-fit:contain;background:#101014}.media video{max-height:78vh}.photo-button{display:block;width:100%;border:0;padding:0;background:transparent;cursor:zoom-in}.photo-button img{transition:transform .5s}.photo-button:hover img{transform:scale(1.035)}.zoom{position:absolute;inset:auto 12px 12px auto;padding:7px 10px;border:1px solid #ffffff45;border-radius:99px;background:#050507a8;color:#fff;font-size:15px;backdrop-filter:blur(8px);pointer-events:none}.caption{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 15px}.caption h2{margin:0;font:400 18px 'Frizon',var(--en),sans-serif;letter-spacing:.03em;overflow-wrap:anywhere}.index{flex:none;color:var(--orange);font:11px 'Space Mono',monospace}.footer{display:flex;justify-content:space-between;gap:15px;padding:20px 0 30px;border-top:1px solid var(--line);color:var(--muted);font:400 16px 'Frizon',var(--fa),sans-serif}.modal{position:fixed;inset:0;z-index:10;display:none;place-items:center;padding:24px;background:rgba(0,0,0,.88);backdrop-filter:blur(12px)}.modal.open{display:grid}.modal img{max-width:min(95vw,1500px);max-height:86vh;width:auto;height:auto;object-fit:contain;border-radius:12px;box-shadow:0 24px 90px #0009}.close{position:absolute;top:20px;inset-inline-end:22px;width:44px;height:44px;border:1px solid #ffffff44;border-radius:50%;background:#111;color:#fff;font-size:24px;cursor:pointer}.modal-title{position:absolute;bottom:16px;color:#eee;font:12px 'Space Mono',monospace}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:650px){.wrap{width:calc(100% - 28px)}.topbar{padding:15px 0;align-items:flex-start}.brand{font-size:15px;gap:8px}.brand img{width:38px;height:38px}.actions{gap:6px;flex-wrap:wrap;justify-content:flex-end}.control,.back{padding:8px 10px;font-size:11px}.hero{padding:45px 0 22px}.toolbar{align-items:flex-start;flex-direction:column}.grid{columns:2 210px;column-gap:12px}.item{margin-bottom:12px}.caption{padding:10px 12px}.footer{flex-direction:column}}@media(max-width:430px){.grid{columns:1}.brand{font-size:14px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
</style></head><body><div class="wrap">
<header class="topbar"><a class="brand" href="works.html" aria-label="Kayan Creative"><img src="https://c269749.parspack.net/asset/mainfiles/logo.png" alt="Kayan Creative logo"><span>KAYAN CREATIVE</span></a><div class="actions"><a class="back" href="works.html" target="_self" id="backBtn"><span aria-hidden="true">←</span><span data-t="back">برگشت به آثار</span></a><button class="control" id="themeBtn" type="button"><span aria-hidden="true">◐</span> <span data-t="theme">پوسته</span></button><button class="control" id="langBtn" type="button" aria-label="Switch language">EN</button></div></header>
<main><section class="hero"><div class="eyebrow">INDUSTRIAL ARCHIVE · KAYAN CREATIVE</div><h1>Industrial<span class="fa-title" data-t="title">آرشیو تولیدات صنعتی</span></h1><p class="intro" data-t="intro">روایت خطوط تولید، فضاهای صنعتی و جزئیات مهندسی در قاب‌های سینمایی.</p></section><div class="toolbar"><span class="count" id="count" aria-live="polite"></span><nav class="filters" aria-label="Media filters"><button class="filter" type="button" data-filter="all" aria-pressed="true" data-t="all">همه</button><button class="filter" type="button" data-filter="video" aria-pressed="false" data-t="videos">ویدیوها</button><button class="filter" type="button" data-filter="photo" aria-pressed="false" data-t="photos">تصاویر</button></nav></div><section class="grid" id="gallery" aria-live="polite" aria-label="Industrial media gallery"></section></main><footer class="footer"><span>KAYAN CREATIVE</span><span data-t="footer">روایت تصویری با نگاه سینمایی</span></footer></div>
<div class="modal" id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer"><button class="close" id="closeModal" type="button" aria-label="Close">×</button><img id="modalImage" alt=""><div class="modal-title" id="modalTitle"></div></div>
<script>(()=>{'use strict';const files=Array.from({length:10},(_,i)=>({name:`Corporate${String(i+1).padStart(2,'0')}.${i<5?'mp4':'jpg'}`,kind:i<5?'video':'photo'}));const base='https://c269749.parspack.net/asset/corporate/';const text={fa:{back:'برگشت به آثار',theme:'پوسته',title:'آرشیو تولیدات صنعتی',intro:'روایت خطوط تولید، فضاهای صنعتی و جزئیات مهندسی در قاب‌های سینمایی.',all:'همه',videos:'ویدیوها',photos:'تصاویر',footer:'روایت تصویری با نگاه سینمایی',count:'{n} اثر'},en:{back:'Back to works',theme:'Theme',title:'Industrial Production Archive',intro:'Production lines, industrial spaces, and engineering details told through cinematic frames.',all:'All',videos:'Videos',photos:'Images',footer:'Visual storytelling, cinematically',count:'{n} works'}};const root=document.documentElement,gallery=document.getElementById('gallery'),count=document.getElementById('count');let lang='fa';function stored(k){try{return localStorage.getItem(k)}catch(e){return null}}function save(k,v){try{localStorage.setItem(k,v)}catch(e){}}function detectLang(){const v=stored('kayan_lang');return v?/^en/i.test(v)?'en':'fa':(/^en/i.test(navigator.language)?'en':'fa')}function applyLang(v){lang=v==='en'?'en':'fa';root.lang=lang;root.dir=lang==='fa'?'rtl':'ltr';document.querySelectorAll('[data-t]').forEach(el=>{const k=el.dataset.t;if(text[lang][k])el.textContent=text[lang][k]});document.getElementById('langBtn').textContent=lang==='fa'?'EN':'فا';document.getElementById('backBtn').setAttribute('aria-label',text[lang].back);document.querySelector('main').setAttribute('aria-label',lang==='fa'?'آرشیو صنعتی':'Industrial archive');updateCount()}function applyTheme(){const pref=stored('kayan_theme');const t=pref==='dark'||pref==='light'?pref:(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');root.dataset.theme=t;document.querySelector('meta[name="theme-color"]').content=t==='dark'?'#0a0a0c':'#f2f3f5';document.getElementById('themeBtn').setAttribute('aria-label',t==='dark'?'Switch to light theme':'Switch to dark theme')}function updateCount(){const n=[...gallery.children].filter(c=>!c.hidden).length;count.textContent=text[lang].count.replace('{n}',String(n).padStart(2,'0'))}function openLightbox(src,title,alt){const m=document.getElementById('lightbox');document.getElementById('modalImage').src=src;document.getElementById('modalImage').alt=alt;document.getElementById('modalTitle').textContent=title;m.classList.add('open');document.body.style.overflow='hidden';document.getElementById('closeModal').focus()}function closeLightbox(){document.getElementById('lightbox').classList.remove('open');document.getElementById('modalImage').src='';document.body.style.overflow=''}function makeCards(){files.forEach((file,i)=>{const card=document.createElement('article');card.className='item';card.dataset.kind=file.kind;const media=document.createElement('div');media.className='media';const src=base+file.name;if(file.kind==='video'){const video=document.createElement('video');video.controls=true;video.autoplay=true;video.muted=true;video.loop=true;video.playsInline=true;video.preload='auto';video.setAttribute('autoplay','');video.setAttribute('muted','');video.setAttribute('loop','');video.setAttribute('playsinline','');video.setAttribute('aria-label',`${file.name} industrial video`);const source=document.createElement('source');source.src=src;source.type='video/mp4';video.append(source);media.append(video);video.play().catch(()=>{})}else{const btn=document.createElement('button');btn.className='photo-button';btn.type='button';btn.setAttribute('aria-label',lang==='fa'?'نمایش بزرگ تصویر':'View image enlarged');const img=document.createElement('img');img.src=src;img.alt=`Industrial production ${i-4}`;img.loading='lazy';img.decoding='async';btn.append(img);const zoom=document.createElement('span');zoom.className='zoom';zoom.textContent='⌕';btn.append(zoom);btn.addEventListener('click',()=>openLightbox(src,file.name,img.alt));media.append(btn)}const cap=document.createElement('div');cap.className='caption';const title=document.createElement('h2');title.textContent=file.name;const index=document.createElement('span');index.className='index';index.textContent=String(i+1).padStart(2,'0');cap.append(title,index);card.append(media,cap);gallery.append(card)})}function filter(kind){document.querySelectorAll('.filter').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.filter===kind)));[...gallery.children].forEach(c=>c.hidden=kind!=='all'&&c.dataset.kind!==kind);updateCount()}const modal=document.getElementById('lightbox');document.querySelectorAll('.filter').forEach(b=>b.addEventListener('click',()=>filter(b.dataset.filter)));document.getElementById('closeModal').addEventListener('click',closeLightbox);modal.addEventListener('click',e=>{if(e.target===modal)closeLightbox()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.classList.contains('open'))closeLightbox()});document.getElementById('themeBtn').addEventListener('click',()=>{save('kayan_theme',root.dataset.theme==='dark'?'light':'dark');applyTheme()});document.getElementById('langBtn').addEventListener('click',()=>{lang=lang==='fa'?'en':'fa';save('kayan_lang',lang);applyLang(lang)});window.addEventListener('storage',e=>{if(e.key==='kayan_theme'||e.key===null)applyTheme();if(e.key==='kayan_lang'||e.key===null)applyLang(detectLang())});try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(!stored('kayan_theme'))applyTheme()})}catch(e){}makeCards();applyLang(detectLang());applyTheme()})();</script></body></html>
