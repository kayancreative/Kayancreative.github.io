<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0a0c"><meta name="description" content="آرشیو فیلم‌ها و تصاویر صنعتی Kayan Creative">
<title>آرشیو صنعتی | Kayan Creative</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Vazirmatn:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0a0a0c;--panel:rgba(23,23,28,.72);--line:rgba(255,255,255,.11);--text:#f7f6f4;--muted:#a5a4ad;--orange:#ff5500;--shadow:0 24px 70px rgba(0,0,0,.32);--fa:'Vazirmatn',Tahoma,sans-serif;--en:'Plus Jakarta Sans',sans-serif}
html[data-theme="light"]{color-scheme:light;--bg:#f2f3f5;--panel:rgba(255,255,255,.78);--line:rgba(22,24,30,.12);--text:#17181d;--muted:#666a75;--shadow:0 20px 60px rgba(20,24,34,.12)}
*{box-sizing:border-box}html{min-height:100%;scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 80% -10%,rgba(255,85,0,.15),transparent 34%),radial-gradient(ellipse at 8% 45%,rgba(89,66,150,.08),transparent 35%),var(--bg);color:var(--text);font-family:var(--fa);line-height:1.7;transition:background .25s,color .25s}html[lang="en"] body{font-family:var(--en)}button{font:inherit;color:inherit}.wrap{width:min(1160px,calc(100% - 44px));margin:auto}.topbar{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:24px 0;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:12px;color:var(--text);text-decoration:none;font-family:var(--en);font-size:14px;font-weight:800;letter-spacing:.08em}.brand-mark{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(140deg,#ff7b35,var(--orange));color:#fff;font-weight:900;font-size:19px;box-shadow:0 8px 28px #ff550044}.actions{display:flex;align-items:center;gap:9px}.control,.back{border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);border-radius:99px;padding:9px 15px;cursor:pointer;transition:.2s;font-size:13px}.control:hover,.back:hover{border-color:#ff550088;background:rgba(255,85,0,.1);transform:translateY(-1px)}.back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--text)}.hero{padding:70px 0 37px}.eyebrow{color:var(--orange);font:700 11px 'Space Mono',monospace;letter-spacing:.18em;text-transform:uppercase;display:flex;align-items:center;gap:11px}.eyebrow:before{content:"";width:26px;height:1px;background:var(--orange)}h1{font-family:var(--en);font-size:clamp(42px,7vw,78px);line-height:1.08;letter-spacing:-.06em;margin:17px 0 8px}.fa-title{display:block;font:800 clamp(25px,4vw,39px)/1.5 var(--fa);letter-spacing:0;margin-top:11px}.intro{margin:14px 0 0;color:var(--muted);font-size:15px;max-width:680px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin:25px 0 23px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.count{color:var(--muted);font:12px 'Space Mono',monospace}.filters{display:flex;flex-wrap:wrap;gap:8px}.filter{border:1px solid var(--line);background:var(--panel);padding:8px 16px;border-radius:99px;cursor:pointer;color:var(--muted);transition:.2s;font-size:13px}.filter:hover{border-color:#ff550088;color:var(--text)}.filter[aria-pressed="true"]{background:var(--orange);color:#fff;border-color:var(--orange);font-weight:700;box-shadow:0 7px 22px #ff550033}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;padding-bottom:72px}.item{overflow:hidden;min-width:0;border:1px solid var(--line);border-radius:19px;background:var(--panel);backdrop-filter:blur(16px);box-shadow:var(--shadow);transition:transform .25s,border-color .25s}.item:hover{transform:translateY(-5px);border-color:#ff550077}.item[hidden]{display:none!important}.media{position:relative;aspect-ratio:4/3;background:#16161b;overflow:hidden}.media video,.media img{display:block;width:100%;height:100%;object-fit:cover}.media video{background:#101014}.photo-button{position:absolute;inset:0;width:100%;height:100%;border:0;padding:0;background:transparent;cursor:zoom-in}.photo-button img{transition:transform .5s}.photo-button:hover img{transform:scale(1.04)}.zoom{position:absolute;inset:auto 12px 12px auto;padding:7px 10px;border:1px solid #ffffff45;border-radius:99px;background:#050507a8;color:#fff;font-size:12px;backdrop-filter:blur(8px);pointer-events:none}.caption{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 15px}.caption h2{margin:0;font-size:13px;font-weight:700;overflow-wrap:anywhere}.index{flex:none;color:var(--orange);font:11px 'Space Mono',monospace}.footer{display:flex;justify-content:space-between;gap:15px;padding:20px 0 30px;border-top:1px solid var(--line);color:var(--muted);font-size:11px}.modal{position:fixed;inset:0;z-index:10;display:none;place-items:center;padding:24px;background:rgba(0,0,0,.86);backdrop-filter:blur(12px)}.modal.open{display:grid}.modal img{max-width:min(95vw,1500px);max-height:86vh;object-fit:contain;border-radius:12px;box-shadow:0 24px 90px #0009}.close{position:absolute;top:20px;inset-inline-end:22px;width:44px;height:44px;border:1px solid #ffffff44;border-radius:50%;background:#111;color:#fff;font-size:24px;cursor:pointer}.modal-title{position:absolute;bottom:16px;left:0;right:0;text-align:center;color:#eee;font:12px 'Space Mono',monospace}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{padding-top:54px}}@media(max-width:580px){.wrap{width:calc(100% - 28px)}.topbar{padding:16px 0;align-items:flex-start}.brand{font-size:11px;gap:8px}.brand-mark{width:35px;height:35px}.actions{gap:6px}.control,.back{padding:8px 10px;font-size:11px}.hero{padding:47px 0 25px}.toolbar{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr;gap:14px}.media{aspect-ratio:16/10}.caption{padding:12px 13px}.footer{flex-direction:column}.intro{font-size:14px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header class="topbar"><a class="brand" href="kayan_creative_updated.html" aria-label="Kayan Creative home"><span class="brand-mark" aria-hidden="true">K</span><span>KAYAN CREATIVE</span></a><div class="actions"><a class="back" href="samples.html" id="backBtn"><span aria-hidden="true">←</span><span data-t="back">برگشت</span></a><button class="control" id="themeBtn" type="button" aria-label="Toggle theme">☼ <span data-t="theme">پوسته</span></button><button class="control" id="langBtn" type="button" aria-label="Switch language">EN</button></div></header>
<main><section class="hero"><div class="eyebrow">INDUSTRIAL ARCHIVE · KAYAN CREATIVE</div><h1>Industrial<span class="fa-title" data-t="title">آرشیو تولیدات صنعتی</span></h1><p class="intro" data-t="intro">روایت خطوط تولید، فضاهای صنعتی و جزئیات مهندسی در قاب‌های سینمایی.</p></section>
<div class="toolbar"><span class="count" id="count"></span><nav class="filters" aria-label="Media filters"><button class="filter" type="button" data-filter="all" aria-pressed="true" data-t="all">همه</button><button class="filter" type="button" data-filter="video" aria-pressed="false" data-t="videos">ویدیوها</button><button class="filter" type="button" data-filter="photo" aria-pressed="false" data-t="photos">تصاویر</button></nav></div>
<section class="grid" id="gallery" aria-live="polite" aria-label="Industrial media gallery"></section></main>
<footer class="footer"><span>KAYAN CREATIVE</span><span data-t="footer">روایت تصویری با نگاه سینمایی</span></footer>
</div>
<div class="modal" id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer"><button class="close" id="closeModal" type="button" aria-label="Close">×</button><img id="modalImage" alt=""><div class="modal-title" id="modalTitle"></div></div>
<script>
(()=>{'use strict';
const files=Array.from({length:10},(_,i)=>({name:`corporate${String(i+1).padStart(2,'0')}.${i<5?'mp4':'jpg'}`,kind:i<5?'video':'photo'}));
const base='https://c269749.parspack.net/asset/corporate/';
const text={fa:{back:'برگشت',theme:'پوسته',title:'آرشیو تولیدات صنعتی',intro:'روایت خطوط تولید، فضاهای صنعتی و جزئیات مهندسی در قاب‌های سینمایی.',all:'همه',videos:'ویدیوها',photos:'تصاویر',footer:'روایت تصویری با نگاه سینمایی',count:'{n} اثر'},en:{back:'Back',theme:'Theme',title:'Industrial Production Archive',intro:'Production lines, industrial spaces, and engineering details told through cinematic frames.',all:'All',videos:'Videos',photos:'Photos',footer:'Visual storytelling, cinematically',count:'{n} works'}};
const root=document.documentElement,gallery=document.getElementById('gallery'),count=document.getElementById('count');let activeFilter='all',lang='fa',userTheme=null;
function stored(k){try{return localStorage.getItem(k)}catch(e){return null}}function save(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function detectLang(){let v=stored('kayan_lang');if(v)return /^en/i.test(v)?'en':'fa';return /^en/i.test(navigator.language)?'en':'fa'}
function applyLang(v){lang=v==='en'?'en':'fa';root.lang=lang;root.dir=lang==='fa'?'rtl':'ltr';document.querySelectorAll('[data-t]').forEach(el=>{let key=el.dataset.t;if(text[lang][key])el.textContent=text[lang][key]});document.querySelectorAll('.filter').forEach(b=>b.setAttribute('aria-label',text[lang][b.dataset.filter==='all'?'all':b.dataset.filter==='video'?'videos':'photos']));document.getElementById('langBtn').textContent=lang==='fa'?'EN':'فا';document.getElementById('backBtn').setAttribute('aria-label',text[lang].back);document.querySelector('main').setAttribute('aria-label',lang==='fa'?'آرشیو صنعتی':'Industrial archive');updateCount()}
function applyTheme(){let pref=userTheme||stored('kayan_theme');let t=pref==='dark'||pref==='light'?pref:(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');root.dataset.theme=t;document.querySelector('meta[name="theme-color"]').content=t==='dark'?'#0a0a0c':'#f2f3f5';document.getElementById('themeBtn').setAttribute('aria-label',t==='dark'?'Switch to light theme':'Switch to dark theme')}
function updateCount(){let visible=[...gallery.children].filter(c=>!c.hidden).length;count.textContent=text[lang].count.replace('{n}',String(visible).padStart(2,'0'))}
function makeCards(){files.forEach((file,i)=>{const card=document.createElement('article');card.className='item';card.dataset.kind=file.kind;const media=document.createElement('div');media.className='media';const src=base+file.name;if(file.kind==='video'){const video=document.createElement('video');video.controls=true;video.playsInline=true;video.preload='metadata';video.setAttribute('aria-label',`${file.name} industrial video`);const source=document.createElement('source');source.src=src;source.type='video/mp4';video.append(source);media.append(video)}else{const btn=document.createElement('button');btn.className='photo-button';btn.type='button';btn.setAttribute('aria-label',lang==='fa'?'نمایش بزرگ تصویر':'View image enlarged');const img=document.createElement('img');img.src=src;img.alt=`Industrial production ${i-4}`;img.loading='lazy';img.decoding='async';btn.append(img);const zoom=document.createElement('span');zoom.className='zoom';zoom.textContent='⌕';btn.append(zoom);btn.addEventListener('click',()=>openLightbox(src,file.name,img.alt));media.append(btn)}const cap=document.createElement('div');cap.className='caption';const title=document.createElement('h2');title.textContent=file.name;const index=document.createElement('span');index.className='index';index.textContent=String(i+1).padStart(2,'0');cap.append(title,index);card.append(media,cap);gallery.append(card)})}
function filter(kind){activeFilter=kind;document.querySelectorAll('.filter').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.filter===kind)));[...gallery.children].forEach(card=>card.hidden=kind!=='all'&&card.dataset.kind!==kind);updateCount()}
const modal=document.getElementById('lightbox');function openLightbox(src,title,alt){document.getElementById('modalImage').src=src;document.getElementById('modalImage').alt=alt;document.getElementById('modalTitle').textContent=title;modal.classList.add('open');document.body.style.overflow='hidden';document.getElementById('closeModal').focus()}function closeLightbox(){modal.classList.remove('open');document.getElementById('modalImage').src='';document.body.style.overflow=''}
document.querySelectorAll('.filter').forEach(b=>b.addEventListener('click',()=>filter(b.dataset.filter)));document.getElementById('closeModal').addEventListener('click',closeLightbox);modal.addEventListener('click',e=>{if(e.target===modal)closeLightbox()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.classList.contains('open'))closeLightbox()});
document.getElementById('themeBtn').addEventListener('click',()=>{userTheme=root.dataset.theme==='dark'?'light':'dark';save('kayan_theme',userTheme);applyTheme()});document.getElementById('langBtn').addEventListener('click',()=>{lang=lang==='fa'?'en':'fa';save('kayan_lang',lang);applyLang(lang)});
// Back uses browser history when available; otherwise the standalone samples page.
document.getElementById('backBtn').addEventListener('click',e=>{if(history.length>1){e.preventDefault();history.back()}});
window.addEventListener('storage',e=>{if(e.key==='kayan_theme'){userTheme=null;applyTheme()}if(e.key==='kayan_lang'){applyLang(detectLang())}});try{const mq=matchMedia('(prefers-color-scheme: dark)');mq.addEventListener('change',()=>{if(!userTheme&&!stored('kayan_theme'))applyTheme()})}catch(e){}
makeCards();applyLang(detectLang());applyTheme();
})();
</script>
</body></html>
