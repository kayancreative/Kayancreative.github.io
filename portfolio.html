<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio</title>
  <style>
    :root{
      --bg:#090a0f;
      --text:#fff;
      --muted:#9aa1b0;
      --accent:#ff5429;
      --border:rgba(255,255,255,.14);
      --glass:rgba(18,20,28,.44);
      --blur:blur(20px);
      --radius:24px;
      --font-fa:'Vazirmatn',sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--font-fa); color:var(--text)}
    .glass{
      background:var(--glass);
      backdrop-filter:var(--blur);
      -webkit-backdrop-filter:var(--blur);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:0 18px 50px rgba(0,0,0,.28);
    }

    .filters{display:flex; gap:10px; overflow-x:auto; padding:8px 2px 16px; scrollbar-width:none}
    .filters::-webkit-scrollbar{display:none}
    .filter-btn{
      padding:10px 20px;
      border-radius:999px;
      border:1px solid var(--border);
      background:rgba(255,255,255,.06);
      color:var(--muted);
      font-weight:900;
      cursor:pointer;
      transition:transform .22s ease, background .22s ease, border-color .22s ease;
      will-change:transform;
      white-space:nowrap;
    }
    .filter-btn:hover{transform:translateY(-2px)}
    .filter-btn.active,.filter-btn:hover{
      background:rgba(255,84,41,.14);
      border-color:rgba(255,84,41,.55);
      color:#fff;
    }

    /* Grid rules requested: small=2, medium=3, large=auto */
    .grid{
      display:grid;
      gap:14px;
      margin-bottom:28px;
      grid-template-columns:repeat(2, minmax(0,1fr));
    }
    @media(min-width: 720px){
      .grid{grid-template-columns:repeat(3, minmax(0,1fr)); gap:18px;}
    }
    @media(min-width: 1100px){
      .grid{
        grid-template-columns:repeat(auto-fill, minmax(240px, 1fr));
        gap:20px;
      }
    }

    .card{
      position:relative;
      aspect-ratio:9/16;
      border-radius:20px;
      overflow:hidden;
      cursor:pointer;
      border:1px solid var(--border);
      background:#0c0e14;
      transition:transform .32s ease, border-color .32s ease, box-shadow .32s ease;
      will-change:transform;
    }
    .card:hover{
      transform:translateY(-6px);
      border-color:rgba(255,84,41,.55);
      box-shadow:0 18px 38px rgba(0,0,0,.55);
    }
    .card video,.card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .45s ease}
    .card:hover video,.card:hover img{transform:scale(1.035)}
    .tag{
      position:absolute;
      bottom:12px;
      left:12px;
      padding:6px 12px;
      border-radius:999px;
      font-size:.78rem;
      font-weight:900;
      color:#fff;
      background:rgba(0,0,0,.62);
      border:1px solid rgba(255,255,255,.14);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
    }
    html[dir="rtl"] .tag{left:auto; right:12px}

    .wrap{padding:12px}
    .title{font-weight:900; margin-bottom:10px}

    /* modal */
    .modal{
      position:fixed; inset:0;
      background:rgba(0,0,0,.92);
      backdrop-filter:blur(18px);
      z-index:1000;
      display:none;
      align-items:center;
      justify-content:center;
      padding:20px;
    }
    .modal.active{display:flex}
    .modal-box{
      position:relative;
      max-width:520px;
      width:100%;
      border-radius:22px;
      overflow:hidden;
      background:#000;
      border:1px solid rgba(255,255,255,.14);
      box-shadow:0 30px 75px rgba(0,0,0,.85);
    }
    .modal-box video,.modal-box img{width:100%;max-height:86vh;object-fit:contain;display:block}
    .close{
      position:absolute; top:14px; right:14px;
      width:42px;height:42px;border-radius:50%;
      background:rgba(0,0,0,.65);
      color:#fff;border:1px solid rgba(255,255,255,.10);
      cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      transition:transform .2s ease, background .2s ease;
      will-change:transform;
      z-index:10;
    }
    .close:hover{background:rgba(255,84,41,.18); transform:translateY(-2px)}
  </style>
</head>

<body>
  <div class="wrap glass">
    <div class="title">Portfolio</div>

    <div class="filters" id="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="Corporate">Corporate</button>
      <button class="filter-btn" data-filter="jewelry">Jewelry</button>
      <button class="filter-btn" data-filter="cafe">Cafe</button>
      <button class="filter-btn" data-filter="Medical">Medical</button>
      <button class="filter-btn" data-filter="gym">Gym</button>
    </div>

    <main class="grid" id="grid" aria-label="Portfolio Grid"></main>
  </div>

  <div class="modal" id="modal" role="dialog" aria-modal="true">
    <div class="modal-box">
      <button class="close" id="modalClose" aria-label="Close">✕</button>
      <div id="modalTarget"></div>
    </div>
  </div>

  <script>
    const ITEMS = [
      { category: 'Corporate', src: 'Corporate/Corporate01.mp4', title: 'Corporate 01' },
      { category: 'Corporate', src: 'Corporate/Corporate02.mp4', title: 'Corporate 02' },
      { category: 'Corporate', src: 'Corporate/Corporate03.mp4', title: 'Corporate 03' },
      { category: 'Corporate', src: 'Corporate/Corporate04.mp4', title: 'Corporate 04' },
      { category: 'Corporate', src: 'Corporate/Corporate05.mp4', title: 'Corporate 05' },
      { category: 'Corporate', src: 'Corporate/Corporate06.jpg', title: 'Corporate 06' },
      { category: 'Corporate', src: 'Corporate/Corporate07.jpg', title: 'Corporate 07' },
      { category: 'Corporate', src: 'Corporate/Corporate08.jpg', title: 'Corporate 08' },
      { category: 'Corporate', src: 'Corporate/Corporate09.jpg', title: 'Corporate 09' },
      { category: 'Corporate', src: 'Corporate/Corporate10.jpg', title: 'Corporate 10' },
      { category: 'Corporate', src: 'Corporate/Corporate11.jpg', title: 'Corporate 11' },

      { category: 'jewelry', src: 'jewelry/jewelry01.mp4', title: 'Jewelry 01' },
      { category: 'jewelry', src: 'jewelry/jewelry02.mp4', title: 'Jewelry 02' },
      { category: 'jewelry', src: 'jewelry/jewelry03.mp4', title: 'Jewelry 03' },

      { category: 'cafe', src: 'cafe/cafe01.mp4', title: 'Cafe 01' },
      { category: 'cafe', src: 'cafe/cafe02.mp4', title: 'Cafe 02' },
      { category: 'cafe', src: 'cafe/cafe03.mp4', title: 'Cafe 03' },

      { category: 'Medical', src: 'Medical/Medical 01.mp4', title: 'Medical 01' },
      { category: 'Medical', src: 'Medical/Medical 02.mp4', title: 'Medical 02' },

      { category: 'gym', src: 'gym.mp4', title: 'Gym' }
    ];

    const grid = document.getElementById('grid');

    function renderGallery(filter='all'){
      grid.innerHTML='';
      const list = filter==='all' ? ITEMS : ITEMS.filter(x => x.category===filter);

      list.forEach(item=>{
        const card=document.createElement('div');
        card.className='card';

        const isVideo = item.src.toLowerCase().endsWith('.mp4') || item.src.toLowerCase().endsWith('.webm');
        const media=document.createElement(isVideo?'video':'img');
        media.src=item.src;

        if(isVideo){
          media.muted=true; media.loop=true; media.playsInline=true;
          media.preload='metadata';
          card.addEventListener('mouseenter', ()=>media.play().catch(()=>{}));
          card.addEventListener('mouseleave', ()=>media.pause());
        } else {
          media.loading='lazy';
        }

        const tag=document.createElement('span');
        tag.className='tag';
        tag.textContent=item.category.toUpperCase();

        card.appendChild(media);
        card.appendChild(tag);
        card.addEventListener('click', ()=>openModal(item));
        grid.appendChild(card);
      })
    }

    const modal=document.getElementById('modal');
    const modalTarget=document.getElementById('modalTarget');
    const modalClose=document.getElementById('modalClose');

    function openModal(item){
      modalTarget.innerHTML='';
      const isVideo = item.src.toLowerCase().endsWith('.mp4') || item.src.toLowerCase().endsWith('.webm');
      const el=document.createElement(isVideo?'video':'img');
      el.src=item.src;
      if(isVideo){ el.controls=true; el.autoplay=true; }
      modalTarget.appendChild(el);
      modal.classList.add('active');
    }
    function closeModal(){
      modalTarget.innerHTML='';
      modal.classList.remove('active');
    }
    modalClose.addEventListener('click', closeModal);
    modal.addEventListener('click', (e)=>{ if(e.target===modal) closeModal(); });
    window.addEventListener('keydown', (e)=>{ if(e.key==='Escape') closeModal(); });

    document.querySelectorAll('.filter-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        renderGallery(btn.dataset.filter);
      })
    });

    // Initial render
    renderGallery('all');

    // Optional: react to language event from index
    window.addEventListener('kayan:lang', (e)=>{ /* reserved for future i18n */ });
  </script>
</body>
</html>
