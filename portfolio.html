<!-- portfolio.html -->
<div class="portfolio-wrapper">
  <!-- منوی فیلترها -->
  <div class="filter-wrapper">
    <nav class="filter-nav" id="pfFilterNav">
      <button class="filter-btn active" data-filter="all" type="button">همه</button>
      <button class="filter-btn" data-filter="Corporate" type="button">شرکتی</button>
      <button class="filter-btn" data-filter="jewelry" type="button">طلا و جواهرات</button>
      <button class="filter-btn" data-filter="cafe" type="button">کافه و رستوران</button>
      <button class="filter-btn" data-filter="Medical" type="button">پزشکی</button>
      <button class="filter-btn" data-filter="gym" type="button">باشگاه و ورزشی</button>
    </nav>
  </div>

  <!-- گرید پورتفولیو -->
  <main class="gallery-grid" id="pfGalleryGrid"></main>
</div>

<!-- مودال نمایش تمام صفحه -->
<div class="modal-backdrop" id="pfModalBackdrop" role="dialog" aria-modal="true">
  <div class="modal-viewport">
    <button class="btn-close" id="pfBtnCloseModal" aria-label="بستن">✕</button>
    <div id="pfModalContent" style="width:100%;height:100%;"></div>
  </div>
</div>

<style>
  .filter-wrapper {
    display: flex;
    justify-content: center;
    margin-bottom: 24px;
    overflow-x: auto;
    padding: 4px 6px 12px;
    scrollbar-width: none;
  }
  .filter-wrapper::-webkit-scrollbar { display: none; }

  .filter-nav {
    display: inline-flex;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--glass-border);
    border-radius: 999px;
    padding: 4px;
    gap: 4px;
    backdrop-filter: blur(16px);
  }

  .filter-btn {
    background: transparent;
    border: none;
    outline: none;
    color: var(--muted);
    padding: 8px 18px;
    font-size: 0.85rem;
    font-weight: 700;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  .filter-btn.active, .filter-btn:hover {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 4px 18px var(--accent-glow);
  }

  /* گرید پورتفولیو — ۲ ستون فیکس در موبایل */
  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }

  @media (min-width: 680px) {
    .gallery-grid {
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
  }

  @media (min-width: 1040px) {
    .gallery-grid {
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }
  }

  /* کارت‌های عمودی 9:16 استاندارد ریلز */
  .reel-card {
    position: relative;
    aspect-ratio: 9 / 16;
    border-radius: var(--radius);
    overflow: hidden;
    background: #0d0f15;
    border: 1px solid var(--glass-border);
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), 
                border-color 0.35s ease, 
                box-shadow 0.35s ease;
    will-change: transform;
  }

  .reel-card:hover {
    transform: translateY(-6px) scale(1.015);
    border-color: rgba(255, 84, 41, 0.5);
    box-shadow: 0 16px 36px rgba(0, 0, 0, 0.7), 0 0 20px var(--accent-glow);
  }

  .card-media {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.6s ease;
  }

  .reel-card:hover .card-media {
    transform: scale(1.05);
  }

  .card-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0, 0, 0, 0.05) 50%, rgba(0, 0, 0, 0.85) 100%);
    pointer-events: none;
    z-index: 1;
  }

  .card-badge {
    position: absolute;
    bottom: 12px;
    right: 12px;
    background: rgba(14, 16, 22, 0.7);
    border: 1px solid rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(8px);
    color: #fff;
    font-size: 0.72rem;
    font-weight: 700;
    padding: 5px 10px;
    border-radius: 999px;
    z-index: 2;
  }

  .play-indicator {
    position: absolute;
    top: 12px;
    left: 12px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(255, 255, 255, 0.1);
    z-index: 2;
  }
  .play-indicator svg {
    width: 12px;
    height: 12px;
    fill: #fff;
    margin-left: 1px;
  }

  /* مودال */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(3, 4, 6, 0.94);
    backdrop-filter: blur(20px);
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }

  .modal-backdrop.open {
    opacity: 1;
    pointer-events: auto;
  }

  .modal-viewport {
    position: relative;
    width: 100%;
    max-width: 440px;
    aspect-ratio: 9 / 16;
    border-radius: 24px;
    overflow: hidden;
    background: #000;
    border: 1px solid rgba(255, 255, 255, 0.14);
    box-shadow: 0 30px 90px rgba(0, 0, 0, 0.9);
    transform: scale(0.94);
    transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  .modal-backdrop.open .modal-viewport {
    transform: scale(1);
  }

  .modal-viewport video, .modal-viewport img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .btn-close {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.65);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 10;
    transition: transform 0.2s ease, background 0.2s ease;
  }

  .btn-close:hover {
    background: var(--accent);
    transform: rotate(90deg);
  }
</style>

<script>
  (function() {
    const ITEMS = [
      { category: 'Corporate', src: 'Corporate/Corporate01.mp4', title: 'Corporate 01' },
      { category: 'Corporate', src: 'Corporate/Corporate02.mp4', title: 'Corporate 02' },
      { category: 'Corporate', src: 'Corporate/Corporate03.mp4', title: 'Corporate 03' },
      { category: 'Corporate', src: 'Corporate/Corporate04.mp4', title: 'Corporate 04' },
      { category: 'Corporate', src: 'Corporate/Corporate05.mp4', title: 'Corporate 05' },
      { category: 'Corporate', src: 'Corporate/Corporate06.jpg', title: 'Corporate 06' },
      { category: 'Corporate', src: 'Corporate/Corporate07.jpg', title: 'Corporate 07' },
      { category: 'Corporate', src: 'Corporate/Corporate08.jpg', title: 'Corporate 08' },
      { category: 'Corporate', src: 'Corporate/Corporate09.jpg', title: 'Corporate 09' },
      { category: 'Corporate', src: 'Corporate/Corporate10.jpg', title: 'Corporate 10' },
      { category: 'Corporate', src: 'Corporate/Corporate11.jpg', title: 'Corporate 11' },

      { category: 'jewelry', src: 'jewelry/jewelry01.mp4', title: 'Jewelry 01' },
      { category: 'jewelry', src: 'jewelry/jewelry02.mp4', title: 'Jewelry 02' },
      { category: 'jewelry', src: 'jewelry/jewelry03.mp4', title: 'Jewelry 03' },

      { category: 'cafe', src: 'cafe/cafe01.mp4', title: 'Cafe 01' },
      { category: 'cafe', src: 'cafe/cafe02.mp4', title: 'Cafe 02' },
      { category: 'cafe', src: 'cafe/cafe03.mp4', title: 'Cafe 03' },

      { category: 'Medical', src: 'Medical/Medical 01.mp4', title: 'Medical 01' },
      { category: 'Medical', src: 'Medical/Medical 02.mp4', title: 'Medical 02' },

      { category: 'gym', src: 'gym.mp4', title: 'Gym Showcase' }
    ];

    const galleryGrid = document.getElementById('pfGalleryGrid');
    const modalBackdrop = document.getElementById('pfModalBackdrop');
    const modalContent = document.getElementById('pfModalContent');
    const btnCloseModal = document.getElementById('pfBtnCloseModal');

    function isVideo(src) {
      const s = String(src).toLowerCase();
      return s.endsWith('.mp4') || s.endsWith('.webm') || s.endsWith('.mov');
    }

    function renderGrid(filter = 'all') {
      if (!galleryGrid) return;
      galleryGrid.innerHTML = '';
      const list = filter === 'all' ? ITEMS : ITEMS.filter(item => item.category === filter);

      list.forEach(item => {
        const isVid = isVideo(item.src);
        const card = document.createElement('article');
        card.className = 'reel-card';
        card.setAttribute('role', 'button');
        card.setAttribute('tabindex', '0');

        let mediaEl;
        if (isVid) {
          mediaEl = document.createElement('video');
          mediaEl.className = 'card-media';
          mediaEl.src = item.src;
          mediaEl.muted = true;
          mediaEl.loop = true;
          mediaEl.playsInline = true;
          mediaEl.preload = 'metadata';
        } else {
          mediaEl = document.createElement('img');
          mediaEl.className = 'card-media';
          mediaEl.src = item.src;
          mediaEl.loading = 'lazy';
        }

        const overlay = document.createElement('div');
        overlay.className = 'card-overlay';

        const badge = document.createElement('span');
        badge.className = 'card-badge';
        badge.textContent = item.category;

        if (isVid) {
          const playIndicator = document.createElement('div');
          playIndicator.className = 'play-indicator';
          playIndicator.innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
          card.appendChild(playIndicator);
        }

        card.appendChild(mediaEl);
        card.appendChild(overlay);
        card.appendChild(badge);

        card.addEventListener('mouseenter', () => { if (isVid) mediaEl.play().catch(() => {}); });
        card.addEventListener('mouseleave', () => {
          if (isVid) {
            mediaEl.pause();
            mediaEl.currentTime = 0;
          }
        });

        const triggerOpen = () => openModal(item);
        card.addEventListener('click', triggerOpen);
        card.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') triggerOpen();
        });

        galleryGrid.appendChild(card);
      });
    }

    function openModal(item) {
      modalContent.innerHTML = '';
      const isVid = isVideo(item.src);
      
      if (isVid) {
        const vid = document.createElement('video');
        vid.src = item.src;
        vid.controls = true;
        vid.autoplay = true;
        vid.playsInline = true;
        vid.loop = true;
        modalContent.appendChild(vid);
      } else {
        const img = document.createElement('img');
        img.src = item.src;
        modalContent.appendChild(img);
      }

      modalBackdrop.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      modalBackdrop.classList.remove('open');
      document.body.style.overflow = '';
      setTimeout(() => { modalContent.innerHTML = ''; }, 300);
    }

    btnCloseModal.addEventListener('click', closeModal);
    modalBackdrop.addEventListener('click', (e) => { if (e.target === modalBackdrop) closeModal(); });
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modalBackdrop.classList.contains('open')) closeModal();
    });

    // مدیریت فیلترها
    document.querySelectorAll('#pfFilterNav .filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#pfFilterNav .filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderGrid(btn.dataset.filter);
      });
    });

    renderGrid('all');
  })();
</script>
