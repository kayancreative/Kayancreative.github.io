<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portfolio • Kayan Creative</title>

  <style>
    :root{
      --bg:#090a0f;
      --text:#fff;
      --muted:#9aa1b0;
      --accent:#ff5429;
      --border:rgba(255,255,255,.14);
      --glass:rgba(18,20,28,.44);
      --blur:blur(20px);
      --radius:24px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      background:transparent;
      color:var(--text);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,"Vazirmatn",sans-serif;
    }

    .glass{
      background:var(--glass);
      backdrop-filter:var(--blur);
      -webkit-backdrop-filter:var(--blur);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:0 18px 50px rgba(0,0,0,.28);
    }

    .wrap{
      padding:14px;
    }

    .header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:12px;
    }
    .title{
      font-weight:900;
      letter-spacing:-.3px;
      font-size:1.05rem;
    }

    /* Filters */
    .filters{
      display:flex;
      gap:10px;
      overflow-x:auto;
      padding:8px 2px 14px;
      scrollbar-width:none;
    }
    .filters::-webkit-scrollbar{display:none}
    .filter-btn{
      padding:10px 18px;
      border-radius:999px;
      border:1px solid var(--border);
      background:rgba(255,255,255,.06);
      color:var(--muted);
      font-weight:900;
      cursor:pointer;
      white-space:nowrap;
      transition:transform .22s ease, background .22s ease, border-color .22s ease;
      will-change:transform;
      user-select:none;
    }
    .filter-btn:hover{transform:translateY(-2px)}
    .filter-btn.active,.filter-btn:hover{
      background:rgba(255,84,41,.14);
      border-color:rgba(255,84,41,.55);
      color:#fff;
    }

    /* =========================
       GRID — استاندارد Reels
       موبایل هم همیشه 2 ستونه
       ========================= */
    .grid{
      display:grid;
      grid-template-columns:repeat(2, minmax(0,1fr)); /* موبایل: 2تایی */
      gap:12px;
      padding-bottom:8px;
    }

    /* تبلت: 3تایی */
    @media (min-width: 720px){
      .grid{
        grid-template-columns:repeat(3, minmax(0,1fr));
        gap:16px;
      }
    }

    /* دسکتاپ: 4تایی (منظم‌تر از auto-fill) */
    @media (min-width: 1100px){
      .grid{
        grid-template-columns:repeat(4, minmax(0,1fr));
        gap:18px;
      }
    }

    .card{
      position:relative;
      border-radius:18px;
      overflow:hidden;
      cursor:pointer;
      border:1px solid var(--border);
      background:#0c0e14;
      transition:transform .28s ease, border-color .28s ease, box-shadow .28s ease;
      will-change:transform;
      isolation:isolate;
    }

    /* 9:16 always */
    .card::before{
      content:"";
      display:block;
      padding-top:177.7778%; /* 16/9 = 1.777... => 9:16 = 1.777 height/width */
    }

    .media{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
      transform:scale(1);
      transition:transform .45s ease;
    }

    .card:hover{
      transform:translateY(-5px);
      border-color:rgba(255,84,41,.55);
      box-shadow:0 18px 38px rgba(0,0,0,.55);
    }
    .card:hover .media{transform:scale(1.035)}

    .tag{
      position:absolute;
      bottom:10px;
      left:10px;
      padding:6px 10px;
      border-radius:999px;
      font-size:.75rem;
      font-weight:900;
      color:#fff;
      background:rgba(0,0,0,.62);
      border:1px solid rgba(255,255,255,.14);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      z-index:2;
    }
    html[dir="rtl"] .tag{left:auto; right:10px}

    /* Optional: subtle top gradient for readability */
    .shade{
      position:absolute;
      inset:0;
      background:linear-gradient(to top, rgba(0,0,0,.32), rgba(0,0,0,0) 52%);
      z-index:1;
      pointer-events:none;
    }

    /* Modal */
    .modal{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.92);
      backdrop-filter:blur(18px);
      z-index:1000;
      display:none;
      align-items:center;
      justify-content:center;
      padding:18px;
    }
    .modal.active{display:flex}
    .modal-box{
      position:relative;
      max-width:560px;
      width:100%;
      border-radius:22px;
      overflow:hidden;
      background:#000;
      border:1px solid rgba(255,255,255,.14);
      box-shadow:0 30px 75px rgba(0,0,0,.85);
    }
    .modal-box video,.modal-box img{
      width:100%;
      max-height:86vh;
      object-fit:contain;
      display:block;
      background:#000;
    }
    .close{
      position:absolute;
      top:12px;
      right:12px;
      width:42px;
      height:42px;
      border-radius:50%;
      background:rgba(0,0,0,.65);
      color:#fff;
      border:1px solid rgba(255,255,255,.10);
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      transition:transform .2s ease, background .2s ease;
      z-index:10;
      user-select:none;
    }
    .close:hover{background:rgba(255,84,41,.18); transform:translateY(-2px)}
  </style>
</head>

<body>
  <section class="wrap glass">
    <div class="header">
      <div class="title">Portfolio</div>
    </div>

    <nav class="filters" id="filters" aria-label="Portfolio filters">
      <button class="filter-btn active" data-filter="all" type="button">All</button>
      <button class="filter-btn" data-filter="Corporate" type="button">Corporate</button>
      <button class="filter-btn" data-filter="jewelry" type="button">Jewelry</button>
      <button class="filter-btn" data-filter="cafe" type="button">Cafe</button>
      <button class="filter-btn" data-filter="Medical" type="button">Medical</button>
      <button class="filter-btn" data-filter="gym" type="button">Gym</button>
    </nav>

    <main class="grid" id="grid" aria-label="Portfolio grid"></main>
  </section>

  <div class="modal" id="modal" role="dialog" aria-modal="true">
    <div class="modal-box">
      <button class="close" id="modalClose" aria-label="Close">✕</button>
      <div id="modalTarget"></div>
    </div>
  </div>

  <script>
    /* FILES (همان ساختار قبلی شما) */
    const ITEMS = [
      { category: 'Corporate', src: 'Corporate/Corporate01.mp4', title: 'Corporate 01' },
      { category: 'Corporate', src: 'Corporate/Corporate02.mp4', title: 'Corporate 02' },
      { category: 'Corporate', src: 'Corporate/Corporate03.mp4', title: 'Corporate 03' },
      { category: 'Corporate', src: 'Corporate/Corporate04.mp4', title: 'Corporate 04' },
      { category: 'Corporate', src: 'Corporate/Corporate05.mp4', title: 'Corporate 05' },
      { category: 'Corporate', src: 'Corporate/Corporate06.jpg', title: 'Corporate 06' },
      { category: 'Corporate', src: 'Corporate/Corporate07.jpg', title: 'Corporate 07' },
      { category: 'Corporate', src: 'Corporate/Corporate08.jpg', title: 'Corporate 08' },
      { category: 'Corporate', src: 'Corporate/Corporate09.jpg', title: 'Corporate 09' },
      { category: 'Corporate', src: 'Corporate/Corporate10.jpg', title: 'Corporate 10' },
      { category: 'Corporate', src: 'Corporate/Corporate11.jpg', title: 'Corporate 11' },

      { category: 'jewelry', src: 'jewelry/jewelry01.mp4', title: 'Jewelry 01' },
      { category: 'jewelry', src: 'jewelry/jewelry02.mp4', title: 'Jewelry 02' },
      { category: 'jewelry', src: 'jewelry/jewelry03.mp4', title: 'Jewelry 03' },

      { category: 'cafe', src: 'cafe/cafe01.mp4', title: 'Cafe 01' },
      { category: 'cafe', src: 'cafe/cafe02.mp4', title: 'Cafe 02' },
      { category: 'cafe', src: 'cafe/cafe03.mp4', title: 'Cafe 03' },

      { category: 'Medical', src: 'Medical/Medical 01.mp4', title: 'Medical 01' },
      { category: 'Medical', src: 'Medical/Medical 02.mp4', title: 'Medical 02' },

      { category: 'gym', src: 'gym.mp4', title: 'Gym' }
    ];

    const grid = document.getElementById('grid');

    function isVideo(src){
      const s = String(src).toLowerCase();
      return s.endsWith('.mp4') || s.endsWith('.webm') || s.endsWith('.mov');
    }

    function renderGallery(filter='all'){
      grid.innerHTML = '';
      const list = (filter === 'all') ? ITEMS : ITEMS.filter(x => x.category === filter);

      list.forEach(item => {
        const card = document.createElement('article');
        card.className = 'card';
        card.setAttribute('role','button');
        card.setAttribute('tabindex','0');
        card.setAttribute('aria-label', item.title);

        const shade = document.createElement('div');
        shade.className = 'shade';

        const tag = document.createElement('span');
        tag.className = 'tag';
        tag.textContent = item.category.toUpperCase();

        const mediaEl = document.createElement(isVideo(item.src) ? 'video' : 'img');
        mediaEl.className = 'media';
        mediaEl.src = item.src;

        if (mediaEl.tagName.toLowerCase() === 'video'){
          mediaEl.muted = true;
          mediaEl.loop = true;
          mediaEl.playsInline = true;
          mediaEl.preload = 'metadata';
          // نکته: روی موبایل autoplay داخل grid اغلب مطلوب نیست؛ مودال برای پخش اصلی است.
        } else {
          mediaEl.loading = 'lazy';
          mediaEl.decoding = 'async';
        }

        card.appendChild(mediaEl);
        card.appendChild(shade);
        card.appendChild(tag);

        const open = () => openModal(item);
        card.addEventListener('click', open);
        card.addEventListener('keydown', (e)=>{ if(e.key==='Enter' || e.key===' ') open(); });

        // Desktop hover preview (اختیاری و سبک)
        card.addEventListener('mouseenter', ()=>{
          if (mediaEl.tagName.toLowerCase()==='video'){
            mediaEl.play().catch(()=>{});
          }
        });
        card.addEventListener('mouseleave', ()=>{
          if (mediaEl.tagName.toLowerCase()==='video'){
            mediaEl.pause();
            mediaEl.currentTime = 0;
          }
        });

        grid.appendChild(card);
      });
    }

    /* Modal */
    const modal = document.getElementById('modal');
    const modalTarget = document.getElementById('modalTarget');
    const modalClose = document.getElementById('modalClose');

    function openModal(item){
      modalTarget.innerHTML = '';
      const el = document.createElement(isVideo(item.src) ? 'video' : 'img');
      el.src = item.src;

      if (el.tagName.toLowerCase()==='video'){
        el.controls = true;
        el.autoplay = true;
        el.playsInline = true;
      } else {
        el.loading = 'eager';
      }

      modalTarget.appendChild(el);
      modal.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeModal(){
      modalTarget.innerHTML = '';
      modal.classList.remove('active');
      document.body.style.overflow = '';
    }

    modalClose.addEventListener('click', closeModal);
    modal.addEventListener('click', (e)=>{ if(e.target === modal) closeModal(); });
    window.addEventListener('keydown', (e)=>{ if(e.key === 'Escape' && modal.classList.contains('active')) closeModal(); });

    /* Filters */
    document.querySelectorAll('.filter-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        renderGallery(btn.dataset.filter);
      });
    });

    /* Init */
    renderGallery('all');
  </script>
</body>
</html>
